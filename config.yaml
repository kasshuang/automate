# AutoMate 配置文件
# Phase 3+: 分层混合Agent配置

# ============================================
# LLM API 配置 - 分层模型支持
# ============================================
llm:
  # ---- 规划模型（高级）----
  # 用于：任务分析、拆解、编排、策略规划
  planner_provider: dashscope
  planner_model: qwen-plus
  
  # ---- 执行模型（简单/便宜）----
  # 用于：执行具体操作步骤、判断下一步
  executor_provider: dashscope
  executor_model: qwen-turbo
  
  # ---- 视觉模型（屏幕理解）----
  # 用于：识别屏幕元素、理解UI布局
  vision_provider: dashscope
  vision_model: qwen-vl-plus
  
  # ---- DeepSeek 配置（推荐 - 最便宜）----
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"      # 注册 https://platform.deepseek.com
    # DeepSeek-V3: ¥1/百万tokens = $0.14/百万
    # DeepSeek-R1: ¥16/百万tokens = $2.2/百万（推理强）
    # 新用户注册送 $1 额度
    timeout: 120
  
  # ---- OpenAI 配置 ----
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    model_vision: "gpt-4o"
    timeout: 120
  
  # ---- Ollama 本地模型配置（完全免费！）----
  # 下载: https://ollama.com
  # 推荐模型: qwen2.5:3b / llama3.2:3b / deepseek-coder-v2:16b
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:3b"                 # 中文好，3B参数
    model_vision: "llama3.2-vision"
    timeout: 300
  
  # ---- 硅基流动（国产，便宜）----
  siliconflow:
    api_key: "${SILICONFLOW_API_KEY}"
    base_url: "https://api.siliconflow.cn/v1"
    model: "deepseek-ai/DeepSeek-V3"
    timeout: 120
  
  # ---- 阿里云百炼（通义千问）----
  # 注册：https://bailian.console.aliyun.com/
  # 百炼新用户送100万tokens免费额度！
  # qwen-turbo: 免费（限时），极快
  # qwen-plus: ¥0.004/千tokens（输入），¥0.012/千tokens（输出）
  # qwen-max: ¥0.04/千tokens（输入），¥0.12/千tokens（输出）
  # qwen-vl-plus: 视觉模型 ¥0.008/千tokens
  dashscope:
    api_key: "sk-63bec4b2e9154415b3a68005309d6226"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    planner_model: "qwen-plus"
    executor_model: "qwen-turbo"
    vision_model: "qwen-vl-plus"
    timeout: 120

# Agent 行为配置
agent:
  # 任务拆解策略
  max_steps: 20                          # 最大拆解步骤数
  max_retries: 3                         # 单步最大重试次数
  retry_delay: 2                         # 重试间隔（秒）
  
  # 截图策略
  screenshot_on_step: true               # 每步后截图
  screenshot_on_error: true              # 错误时截图
  screenshot_quality: 85                 # JPEG 质量
  
  # 执行模式
  confirm_before_execute: false           # 执行前确认
  verbose: true                          # 详细输出
  
  # 上下文窗口
  include_last_screenshot: true         # 包含最近截图
  include_mouse_position: true            # 包含鼠标位置

# 可用工具定义（Function Calling）
tools:
  - name: click
    description: "点击屏幕指定坐标"
    params:
      x: {type: "integer", required: true, description: "X坐标"}
      y: {type: "integer", required: true, description: "Y坐标"}
      button: {type: "string", default: "left", description: "鼠标按钮: left/right/middle"}
  
  - name: double_click
    description: "双击屏幕指定坐标"
    params:
      x: {type: "integer", required: true}
      y: {type: "integer", required: true}
  
  - name: right_click
    description: "右键点击"
    params:
      x: {type: "integer", required: true}
      y: {type: "integer", required: true}
  
  - name: move_mouse
    description: "移动鼠标到指定位置"
    params:
      x: {type: "integer", required: true}
      y: {type: "integer", required: true}
      duration: {type: "number", default: 0.5}
  
  - name: type_text
    description: "键盘输入文字"
    params:
      text: {type: "string", required: true, description: "要输入的文字"}
      interval: {type: "number", default: 0.05}
  
  - name: press_key
    description: "按键盘按键"
    params:
      key: {type: "string", required: true, description: "按键名如: enter, tab, esc, a, 1等"}
  
  - name: hotkey
    description: "组合键如 Ctrl+C"
    params:
      keys: {type: "array", items: "string", required: true, description: "按键列表"}
  
  - name: screenshot
    description: "截取当前屏幕"
    params:
      region: {type: "object", description: "截取区域 {x, y, width, height}"}
  
  - name: find_image
    description: "在屏幕上查找图片"
    params:
      image_path: {type: "string", required: true, description: "图片路径"}
      confidence: {type: "number", default: 0.8}
  
  - name: get_clipboard
    description: "读取剪贴板内容"
    params: {}
  
  - name: set_clipboard
    description: "设置剪贴板内容"
    params:
      text: {type: "string", required: true}
  
  - name: wait
    description: "等待指定秒数"
    params:
      seconds: {type: "number", required: true}

# 预设任务模板
presets:
  publish_xianyu:
    name: "闲鱼发布商品"
    description: "在闲鱼App发布二手商品"
    required_params: ["title", "price"]
    optional_params: ["description", "images"]
  
  publish_wechat_article:
    name: "微信公众号发布"
    description: "在公众号后台发布文章"
    required_params: ["title", "content"]
    optional_params: ["cover_image"]
  
  fill_online_form:
    name: "在线表单填写"
    description: "批量填写网页表单"
    required_params: ["fields"]
    optional_params: ["submit"]
